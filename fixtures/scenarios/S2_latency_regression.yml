narrative: >
  Inventory service is updated to v1.2.0 which bypasses Redis cache lookups and runs a secondary database query per request.
  The hot stock check path experiences severe datastore contention, leading to high query latency.
  Checkout tail p95 response time breaches SLA thresholds while error rates remain near zero.

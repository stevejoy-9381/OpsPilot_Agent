narrative: >
  A benign refactoring deploy upgrades orders to v1.1.0 with identical performance and zero functional change.
  Shortly thereafter, Redis suffers a severe latency degradation that triggers inventory cache timeouts and Postgres fallbacks.
  The investigation agent must avoid scapegoating the recent orders deployment and correctly attribute the incident to Redis.

name: opspilot

# Network intent:
#   core   - api, postgres, redis. Private application traffic.
#   lab    - toy microservices and data stores.
#   broker - broker only. Isolated control plane; the LLM worker must never join it.
# See infra/README.md for the trust-boundary rationale.
networks:
  core:
  evidence:
    internal: true
  lab:
    internal: true
  broker:
    internal: true

services:
  postgres:
    image: postgres:19.0-bookworm
    restart: unless-stopped
    profiles:
      - core
    mem_limit: 512m
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-opspilot}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-change-me-local-only}
      POSTGRES_DB: ${POSTGRES_DB:-opspilot}
    ports:
      # Loopback only: never expose the application database on external interfaces.
      - "127.0.0.1:5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql
    networks:
      - core
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s

  redis:
    image: redis:8.10.3-alpine
    restart: unless-stopped
    profiles:
      - core
    mem_limit: 256m
    command: ["redis-server", "--save", "", "--appendonly", "no"]
    ports:
      - "127.0.0.1:6379:6379"
    networks:
      - core
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 5s

  worker:
    build:
      context: ..
      dockerfile: infra/Dockerfile.worker
    restart: unless-stopped
    profiles:
      - core
      - worker
    mem_limit: 512m
    environment:
      DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-opspilot}:${POSTGRES_PASSWORD:-change-me-local-only}@postgres:5432/${POSTGRES_DB:-opspilot}
      REDIS_URL: redis://redis:6379/0
      OPSPILOT_SERVICE_TOKEN: ${OPSPILOT_SERVICE_TOKEN:-service-principal-token-test}
      WORKER_CONCURRENCY: ${WORKER_CONCURRENCY:-1}
      RUN_TIMEOUT_SECONDS: ${RUN_TIMEOUT_SECONDS:-120}
    networks:
      - core
      - evidence

# Deliberate: no service in this file mounts the host Docker control socket.
volumes:
  postgres_data:

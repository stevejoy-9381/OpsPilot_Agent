name: CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

permissions:
  contents: read

jobs:
  backend:
    name: Backend Lint, Typecheck, and Test
    runs-on: ubuntu-24.04
    services:
      postgres:
        image: postgres:17.4-alpine
        env:
          POSTGRES_USER: opspilot
          POSTGRES_PASSWORD: opspilot_dev_password
          POSTGRES_DB: opspilot
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 5
      redis:
        image: redis:7.4.2-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 5
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4.2.2

      - name: Set up uv
        uses: astral-sh/setup-uv@v5.2.1
        with:
          enable-cache: true

      - name: Set up Python 3.12
        uses: actions/setup-python@v5.4.0
        with:
          python-version: "3.12"

      - name: Install backend dependencies
        run: uv sync --extra dev

      - name: Lint with Ruff
        run: uv run ruff check .

      - name: Typecheck with Mypy
        run: uv run mypy apps agent lab tools baseline shared evals tests

      - name: Run Alembic migration reversibility check (up -> down -> up)
        env:
          DATABASE_URL: postgresql+psycopg://opspilot:opspilot_dev_password@127.0.0.1:5432/opspilot
        run: |
          uv run alembic upgrade head
          uv run alembic downgrade 0001_baseline
          uv run alembic upgrade head

      - name: Run backbone lifecycle driver tests
        env:
          DATABASE_URL: postgresql+psycopg://opspilot:opspilot_dev_password@127.0.0.1:5432/opspilot
          REDIS_URL: redis://127.0.0.1:6379/0
        run: uv run pytest tests/backbone/test_lifecycle.py -v

      - name: Run tenant isolation and RLS tests
        env:
          DATABASE_URL: postgresql+psycopg://opspilot:opspilot_dev_password@127.0.0.1:5432/opspilot
          REDIS_URL: redis://127.0.0.1:6379/0
        run: uv run pytest tests/test_db_invariants.py tests/test_run_events.py -v

      - name: Run evidence-store parity and adversarial tests
        env:
          DATABASE_URL: postgresql+psycopg://opspilot:opspilot_dev_password@127.0.0.1:5432/opspilot
          REDIS_URL: redis://127.0.0.1:6379/0
        run: uv run pytest tests/test_postgres_evidence_store.py tests/test_tools_adversarial.py -v

      - name: Verify database invariants (zero violations)
        env:
          DATABASE_URL: postgresql+psycopg://opspilot:opspilot_dev_password@127.0.0.1:5432/opspilot
        run: uv run python scripts/db_invariants.py

      - name: Run backend tests
        env:
          DATABASE_URL: postgresql+psycopg://opspilot:opspilot_dev_password@127.0.0.1:5432/opspilot
          REDIS_URL: redis://127.0.0.1:6379/0
          POSTGRES_USER: opspilot
          POSTGRES_PASSWORD: opspilot_dev_password
          POSTGRES_DB: opspilot
        run: uv run pytest -v -m "not lab and not live"

      - name: Run offline baseline evaluation harness
        run: uv run python -m evals.baseline_runner --variants b0,b1,b2 --scenarios all --trials 1 --offline

  frontend:
    name: Frontend Lint and Test
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4.2.2

      - name: Set up Node.js 22
        uses: actions/setup-node@v4.2.0
        with:
          node-version: "22"
          cache: "npm"
          cache-dependency-path: apps/web/package-lock.json

      - name: Install web dependencies
        run: npm --prefix apps/web ci

      - name: Lint web UI
        run: npm --prefix apps/web run lint

      - name: Test web UI
        run: npm --prefix apps/web test

  infra-and-security:
    name: Infra & Security Validation
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4.2.2

      - name: Check Docker socket exposure
        run: bash scripts/check_no_docker_socket.sh

      - name: Validate Docker Compose config
        run: docker compose -f infra/docker-compose.yml config --quiet
